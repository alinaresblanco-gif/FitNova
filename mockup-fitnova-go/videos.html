<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FitNova Go · Vídeos</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0A1A2F" />
<link rel="stylesheet" href="css/styles.css?v=20260922.11" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <a href="perfil.html" class="icon-square" title="Personalizar perfil"><img src="../imagenes/LOGO-FITNOVA USUARIO.png" alt="Perfil" /></a>
      <div class="header-actions">
        <button class="icon-btn" onclick="openModal('modal-chat')" title="Chat">💬<span class="badge">2</span></button>
        <button class="icon-btn" onclick="openModal('modal-notificaciones')" title="Notificaciones">🔔<span class="badge">3</span></button>
      </div>
    </header>

    <main class="app-content">
      <div class="videos-heading"><h1>Vídeos</h1></div>
      <div class="video-tabs" role="tablist">
        <button class="video-tab active" data-library="all" role="tab"><span class="video-tab-icon">▤</span>Todos</button>
        <button class="video-tab" data-library="favorites" role="tab"><span class="video-tab-icon">★</span>Mis favoritos</button>
      </div>
      <div class="video-panel" role="tabpanel">
        <div class="video-search-row">
          <button class="video-filter-button" onclick="openVideoFilters()" title="Filtrar vídeos">☷</button>
          <label class="video-search"><span>⌕</span><input id="video-search" type="search" placeholder="Buscar..." aria-label="Buscar vídeos" /></label>
        </div>
        <p id="video-filter-summary" class="video-filter-summary">Buscando por nombre</p>
        <section id="video-list" class="video-list" aria-live="polite"></section>
      </div>
    </main>

    <nav class="bottom-nav">
      <a href="index.html"><span class="nav-icon">🏠</span>Inicio</a>
      <a href="agenda.html"><span class="nav-icon">📅</span>Agenda</a>
      <a href="videos.html" class="active"><span class="nav-icon">▶️</span>Vídeos</a>
      <a href="placeholder.html?vista=Evolución"><span class="nav-icon">📈</span>Evolución</a>
    </nav>

    <div class="modal-overlay" id="modal-filtros-video">
      <div class="modal">
        <div class="modal-header"><h2>Buscar vídeos por</h2><button class="modal-close" onclick="closeModal('modal-filtros-video')">✕</button></div>
        <div class="video-filter-options">
          <button class="video-filter-option active" data-filter="name">Nombre</button>
          <button class="video-filter-option" data-filter="date">Fecha</button>
          <button class="video-filter-option" data-filter="activity">Actividad</button>
        </div>
      </div>
    </div>
    <div class="modal-overlay" id="modal-chat"><div class="modal"><div class="modal-header"><h2>Chat</h2><button class="modal-close" onclick="closeModal('modal-chat')">✕</button></div><p>Tu equipo profesional está disponible para ayudarte.</p></div></div>
    <div class="modal-overlay" id="modal-notificaciones"><div class="modal"><div class="modal-header"><h2>Notificaciones</h2><button class="modal-close" onclick="closeModal('modal-notificaciones')">✕</button></div><div class="list-item"><span>Carlos te ha enviado una nueva rutina</span><span>Hoy</span></div></div></div>
  </div>
  <script src="js/app.js?v=20260922.11"></script>
  <script>initVideos();</script>
</body>
</html>
