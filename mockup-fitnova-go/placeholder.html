<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FitNova Go</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0A1A2F" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <button class="icon-btn" onclick="location.href='index.html'" title="Volver">←</button>
      <span id="titulo-vista" style="font-weight:700;font-size:15px;">Vista</span>
      <span style="width:42px;"></span>
    </header>

    <main class="app-content" style="display:flex;align-items:center;justify-content:center;text-align:center;">
      <div>
        <p style="font-size:40px;margin:0;">🚧</p>
        <p style="color:#55606f;">Esta vista se definirá en la siguiente ronda de maquetado.</p>
      </div>
    </main>

    <nav class="bottom-nav">
      <a href="index.html"><span class="nav-icon">🏠</span>Inicio</a>
      <a href="placeholder.html?vista=Agenda" data-vista="Agenda"><span class="nav-icon">📅</span>Agenda</a>
      <a href="videos.html" data-vista="Videos"><span class="nav-icon">▶️</span>Vídeos</a>
      <a href="placeholder.html?vista=Evolución" data-vista="Evolución"><span class="nav-icon">📈</span>Evolución</a>
    </nav>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const vista = params.get('vista') || 'Vista';
    document.getElementById('titulo-vista').textContent = vista;
    document.querySelectorAll('.bottom-nav a').forEach((a) => {
      if (a.dataset.vista === vista) a.classList.add('active');
    });
  </script>
  <script src="js/app.js"></script>
</body>
</html>
