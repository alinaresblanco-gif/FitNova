<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, initial-scale=1.0" />
<title>FitNova Manager · Agenda</title>
<link rel="icon" href="../imagenes/LOGO FITNOVA MANAGER.png" />
<link rel="stylesheet" href="css/styles.css?v=20261123.1" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="../css/comunicacion.css?v=20261126.1" />
</head>
<body data-view="agenda" data-tab-group="agenda-vista">

  <header class="topbar">
    <a href="index.html" class="topbar-brand">
      <img src="../imagenes/LOGO FITNOVA MANAGER.png" alt="FitNova Manager" />
    </a>
    <nav class="topbar-nav">
      <a href="index.html" class="topbar-link" data-view="dashboard"><span class="ico">🏠</span>Inicio</a>
      <a href="clientes.html" class="topbar-link" data-view="clientes"><span class="ico">👥</span>Clientes<span class="chev">▾</span></a>
      <a href="equipo.html" class="topbar-link" data-view="equipo"><span class="ico">🧑‍🤝‍🧑</span>Equipo<span class="chev">▾</span></a>
      <a href="libreria.html" class="topbar-link" data-view="libreria"><span class="ico">📚</span>Librería<span class="chev">▾</span></a>
      <a href="agenda.html" class="topbar-link" data-view="agenda"><span class="ico">📅</span>Agenda<span class="chev">▾</span></a>
      <a href="negocio.html" class="topbar-link" data-view="negocio"><span class="ico">💼</span>Negocio<span class="chev">▾</span></a>
    </nav>
    <div class="topbar-actions">
      <a href="chat.html" class="topbar-icon-btn" title="Chat" style="text-decoration:none;">💬<span class="badge" hidden></span></a>
      <button class="topbar-icon-btn" title="Ayuda">❓</button>
      <div class="topbar-avatar" title="Mi cuenta">
        <div class="avatar-circle">B</div>
        <span class="chev">▾</span>
      </div>
    </div>
  </header>

  <div class="app-shell">
    <div class="page-header">
      <p class="breadcrumb">Agenda / Sesiones y citas</p>
      <h1>Agenda</h1>
      <p class="subtitle">Sesiones individuales y seguimiento compartidos con tus clientes en Go.</p>
    </div>

    <div class="page-body single">
      <section class="card">
        <div class="list-toolbar">
          <div class="list-toolbar-left">
            <div class="tabs" style="border-bottom:none;margin-bottom:0;">
              <button class="tab-btn active" data-tab-group="agenda-vista" data-tab="lista" onclick="switchTab('agenda-vista','lista')">📃 Lista</button>
              <button class="tab-btn" data-tab-group="agenda-vista" data-tab="calendario" onclick="switchTab('agenda-vista','calendario')">🗓️ Calendario</button>
            </div>
          </div>
          <div class="list-toolbar-right">
            <button class="btn-outline" id="agenda-actualizar">Actualizar</button>
            <button class="btn-secondary" id="agenda-crear" onclick="abrirSesion()" disabled>➕ Agendar sesión</button>
          </div>
        </div>
        <div class="list-toolbar">
          <label>Cliente <select id="agenda-cliente"><option value="">Todos mis clientes</option></select></label>
          <label>Estado <select id="agenda-estado">
            <option value="">Todos</option><option value="programada">Programada</option>
            <option value="cancelada">Cancelada</option><option value="completada">Completada</option>
          </select></label>
          <span id="agenda-zona"></span>
        </div>
        <p id="agenda-error" class="sesion-error" role="alert"></p>
        <p id="agenda-info" role="status"></p>
        <div class="tab-panel active" data-tab-panel-group="agenda-vista" data-tab-panel="lista">
          <div id="agenda-sesiones"><p>Cargando sesiones...</p></div>
        </div>
        <div class="tab-panel" data-tab-panel-group="agenda-vista" data-tab-panel="calendario">
          <div class="list-toolbar">
            <button class="btn-outline" id="agenda-anterior" aria-label="Mes anterior">←</button>
            <h2 id="agenda-mes"></h2>
            <button class="btn-outline" id="agenda-siguiente" aria-label="Mes siguiente">→</button>
          </div>
          <div class="sesion-calendario" id="agenda-calendario"></div>
          <div id="agenda-dia"></div>
        </div>
      </section>
    </div>
  </div>

  <div class="modal-overlay" id="modal-nueva-sesion">
    <div class="modal">
      <div class="modal-header">
        <h2 id="ses-modal-titulo">Agendar sesión</h2>
        <button class="modal-close" onclick="closeModal('modal-nueva-sesion')">✕</button>
      </div>
      <form id="ses-form" class="sesion-form">
      <input type="hidden" id="ses-id" />
      <label for="ses-cliente">Cliente activo</label>
      <select id="ses-cliente" required><option value="">Selecciona un cliente</option></select>
      <label for="ses-nombre">Nombre de la sesión</label>
      <input type="text" id="ses-nombre" maxlength="150" required placeholder="Ej. Revisión inicial" />
      <div style="display:flex;gap:12px;margin-bottom:14px;">
        <div style="flex:1;">
          <label for="ses-fecha">Fecha</label>
          <input type="date" id="ses-fecha" required />
        </div>
        <div style="flex:1;">
          <label for="ses-hora">Hora</label>
          <input type="time" id="ses-hora" required />
        </div>
      </div>
      <label for="ses-tipo">Tipo de servicio</label>
      <select id="ses-tipo" required>
        <option value="entrenamiento_personal">Entrenamiento personal</option>
        <option value="seguimiento">Seguimiento</option>
      </select>
      <label for="ses-duracion">Duración (minutos)</label>
      <input type="number" id="ses-duracion" min="1" step="1" value="60" required />
      <label for="ses-lugar">Lugar o enlace de videollamada (opcional)</label>
      <input type="text" id="ses-lugar" maxlength="500" />
      <p id="ses-zona"></p>
      <p id="ses-error" class="sesion-error" role="alert"></p>
      <button type="submit" class="btn-secondary" id="ses-guardar">Guardar sesión</button>
      </form>
    </div>
  </div>

  <script src="js/app.js?v=20261123.1"></script>
  <script src="js/supabase-client.js?v=20261126.6"></script>
  <script src="../js/comunicacion.js?v=20261126.3"></script>
  <script src="../js/comunicacion-header.js?v=20261126.2"></script>
  <script src="../js/sesiones.js?v=20261123.2"></script>
  <script src="js/agenda.js?v=20261123.1"></script>
</body>
</html>
